[package]
name = "WinKit"
version = "0.1.0"
description = "WinKit 工具箱：快捷方式、进程与环境变量管理"
authors = ["you"]
edition = "2024"

[[bin]]
name = "WinKit"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shortcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
windows-service = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = "z"     # 修正："z" 为极致优化体积，"s" 为平衡体积与速度。
codegen-units = 1   # 最大化优化，代价是单线程缓慢编译。
lto = "fat"         # 跨 crate 的全局深度优化（写 true 也可以，fat 更明确）。
panic = "abort"     # 禁用栈展开代码。
strip = true        # 剔除调试信息和符号表。
